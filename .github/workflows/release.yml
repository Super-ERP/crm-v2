name: release

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out verified main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Create next release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" --jq '.files[].filename')"
          if ! printf '%s\n' "$changed_files" | grep -qvE '^(docs/|README\.md$)'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tag="$(git tag --points-at "$SOURCE_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$existing_tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)"
          if printf '%s\n' "$labels" | grep -qx 'release:none'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "no valid release tag found" >&2; exit 1; }
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if printf '%s\n' "$labels" | grep -qx 'release:major'; then
            major=$((major + 1)); minor=0; patch=0
          elif printf '%s\n' "$labels" | grep -qx 'release:minor'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          release_tag="v${major}.${minor}.${patch}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$release_tag" "$SOURCE_SHA" -m "Release $release_tag"
          git push origin "$release_tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Build signed release
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release-images.yml --ref main -f ref="$RELEASE_TAG"
