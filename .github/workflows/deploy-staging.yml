name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful release-images workflow run to deploy
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: read

jobs:
  deploy-staging:
    runs-on: self-hosted
    environment: staging
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve immutable release images
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid release run id" >&2; exit 1; }
          release_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          printf '%s' "$release_run" | jq -e '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .path == ".github/workflows/release-images.yml" and
            .head_branch == "main"
          ' >/dev/null || { echo "release run is not a successful main release" >&2; exit 1; }
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts?per_page=100")"
          release_tag="$(printf '%s' "$artifact_json" | jq -er '
            [.artifacts[] | select(.expired == false and (.name | startswith("release-manifest-v"))) | .name]
            | if length == 1 then .[0] else error("expected exactly one release manifest") end
            | sub("^release-manifest-"; "")
          ')"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag" >&2; exit 1; }
          manifest_dir="$(mktemp -d)"
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-manifest-${release_tag}" \
            --dir "$manifest_dir"
          manifest="$manifest_dir/release-manifest.json"
          jq -e '
            (.source_commit | test("^[0-9a-f]{40}$")) and
            (.images | length == 4) and
            all(.images[]; (.image_ref | test("^ghcr.io/super-erp/crm-[a-z-]+@sha256:[0-9a-f]{64}$")))
          ' "$manifest" >/dev/null
          source_sha="$(jq -er '.source_commit' "$manifest")"
          web_image="$(jq -er '.images[] | select(.name == "web") | .image_ref' "$manifest")"
          migrator_image="$(jq -er '.images[] | select(.name == "migrator") | .image_ref' "$manifest")"
          echo "DEPLOY_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$web_image" >> "$GITHUB_ENV"
          echo "MIGRATOR_IMAGE=$migrator_image" >> "$GITHUB_ENV"
          rm -rf -- "$manifest_dir"
      - name: Test signed production bundle locally
        env:
          VENDOR_ENTITLEMENT_TRUST_SET: ${{ secrets.STAGING_VENDOR_ENTITLEMENT_TRUST_SET }}
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          export DOCKER_CONFIG="$TEMP_DIR/docker-auth"
          trap 'rm -rf -- "$TEMP_DIR"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "client-deployment-bundle-${RELEASE_TAG}" --dir "$TEMP_DIR"
          cosign verify-blob \
            --bundle "$TEMP_DIR/client-deployment-bundle.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$TEMP_DIR/client-deployment-bundle.tar.gz"
          tar -xzf "$TEMP_DIR/client-deployment-bundle.tar.gz" -C "$TEMP_DIR"
          node "$TEMP_DIR/client/ops/smoke-release.mjs" "$TEMP_DIR/client"
      - name: Promote verified release to production
        run: gh workflow run deploy.yml --ref main -f release_tag="$RELEASE_TAG"
      - name: Publish deployment summary
        run: |
          echo "Local production-bundle smoke passed for $RELEASE_TAG; production deployment queued." >> "$GITHUB_STEP_SUMMARY"
